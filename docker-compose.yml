services:
  tob-calculator:
    build:
      context: .
      # Build on the host network so pip reaches Pi-hole on 127.0.0.1; the default
      # build sandbox only inherits the Pi's unusable IPv6 nameservers.
      network: host
    ports:
      - "5000:5000"
    volumes:
      - ./outputs:/app/outputs
    environment:
      FLASK_HOST: "0.0.0.0"
      FLASK_DEBUG: "0"
      FLASK_PORT: "5000"
    restart: unless-stopped
